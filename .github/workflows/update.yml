# Каждый час собирает свежий отчёт WFM Profit и публикует его на GitHub Pages.
# Вручную: вкладка Actions -> "Обновить отчёт" -> Run workflow.
name: Обновить отчёт

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17 (UTC)
  workflow_dispatch:        # кнопка "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wfm-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # кэш: состав сетов (3 дня) и история продаж (3 часа) — чтобы не качать каждый раз
      - name: Восстановить кэш
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: wfm-cache-${{ github.run_id }}
          restore-keys: wfm-cache-

      - name: Скан рынка
        env:
          WFM_REPORT: site/index.html
          PYTHONUNBUFFERED: "1"
        run: python wfm_profit.py --no-open

      - name: Сохранить кэш
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: wfm-cache-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
